[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-misconfig-checker"
version = "1.0.0"
description = "Static security scanner for Terraform code and plans: public buckets, open security groups, unencrypted storage, wildcard IAM and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["terraform", "iac", "security", "static-analysis", "aws", "azure", "gcp", "sarif", "devsecops"]
authors = [{ name = "Dave Alexis" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
tfcheck = "tfcheck.cli:main"

[project.urls]
Homepage = "https://github.com/DaveyD347/terraform-misconfig-checker"
Issues = "https://github.com/DaveyD347/terraform-misconfig-checker/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline Terraform snippets

[tool.ruff.lint.isort]
known-first-party = ["tfcheck", "conftest"]
